<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#292a2e"><meta name="description" content="StudyOS — your personal university workspace"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="StudyOS"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="stylesheet" href="styles.css"><title>StudyOS</title></head>
<body><div class="app-shell"><aside class="sidebar glass"><a class="brand" href="#"><span class="brand-icon">S</span><span>Study<span class="orange">OS</span><small>STUDY WORKSPACE</small></span></a><div class="workspace-label" data-t="workspace">WORKSPACE</div><nav id="navigation"><button class="nav-item active" data-page="dashboard"><span>▦</span><span data-t="dashboard">Dashboard</span></button><button class="nav-item" data-page="courses"><span>▤</span><span data-t="courses">Courses</span></button><button class="nav-item" data-page="tasks"><span>☑</span><span data-t="tasks">Tasks</span></button><button class="nav-item" data-page="notes"><span>✎</span><span data-t="notes">Notes & summaries</span></button><button class="nav-item" data-page="planner"><span>◷</span><span data-t="planner">Agenda</span></button><button class="nav-item" data-page="timetable"><span>▦</span><span data-t="timetable">Timetable</span></button><button class="nav-item" data-page="files"><span>↥</span><span data-t="files">Cloud files</span></button><button class="nav-item" data-page="grades"><span>▥</span><span data-t="grades">Grades</span></button><button class="nav-item" data-page="revision"><span>✧</span><span data-t="revision">Revision</span></button><button class="nav-item" data-page="analytics"><span>⌁</span><span data-t="analytics">Analytics</span></button></nav><div class="sidebar-bottom"><div class="sync-status"><span class="status-dot" id="statusDot"></span><span id="syncLabel">Local mode</span></div><button class="nav-item" data-page="settings"><span>⚙</span><span data-t="settings">Settings & backup</span></button><div class="profile"><div class="avatar">S</div><div><b id="profileName">StudyOS Student</b><small id="profileSub">Personal workspace</small></div></div></div></aside>
<main class="main-content"><header class="topbar"><div><div class="eyebrow">USTHB · SNV BIOLOGY</div><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><select id="globalLanguage" class="language-switch" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">عربي</option></select><span class="date-chip" id="todayLabel"></span><button class="icon-button" id="installBtn" hidden title="Install StudyOS">⇩</button><button class="button primary small" id="quickAdd">＋ <span data-t="addNew">Add new</span></button></div></header><section id="pageContent" aria-live="polite"></section><footer>StudyOS <span>·</span> <span data-t="footer">Organize your studies, at your pace.</span></footer></main></div>
<div class="toast" id="toast" role="status"></div><dialog id="itemDialog" class="dialog glass"><form id="itemForm"><div class="dialog-head"><h2 id="dialogTitle">Add item</h2><button type="button" class="icon-button" id="closeDialog">×</button></div><input type="hidden" id="itemId"><label><span data-t="titleLabel">Title</span><input id="itemTitle" required maxlength="140" placeholder="e.g. Cell biology lecture"></label><div class="form-grid"><label><span data-t="typeLabel">Category</span><select id="itemType"><option value="course">Course</option><option value="task">Task / assignment</option><option value="note">Note / summary</option><option value="event">Planner event</option><option value="revision">Flashcard</option></select></label><label><span data-t="subjectLabel">Subject</span><input id="itemSubject" maxlength="100" placeholder="e.g. Cell biology"></label></div><label><span data-t="dateLabel">Due date</span><input id="itemDate" type="date"></label><label><span data-t="detailsLabel">Details</span><textarea id="itemDetails" rows="4" maxlength="12000" placeholder="Write notes, objectives, answer, links..."></textarea></label><label id="fileLabel"><span data-t="attachmentLabel">Attachment (optional)</span><input id="itemFile" type="file"><small data-t="fileHint">Files are uploaded to Supabase Storage when configured; otherwise only metadata is saved locally.</small></label><div class="dialog-actions"><button type="button" class="button secondary" id="cancelDialog" data-t="cancel">Cancel</button><button class="button primary" type="submit" data-t="save">Save</button></div></form></dialog>
<dialog id="authDialog" class="dialog glass"><form id="authForm"><div class="dialog-head"><div><h2 data-t="account">Account & sync</h2><p class="muted" data-t="authIntro">Sign in to sync across your devices.</p></div><button type="button" class="icon-button" id="closeAuth">×</button></div><label>Email<input type="email" id="authEmail" required autocomplete="email" placeholder="you@example.com"></label><label data-t="password">Password<input type="password" id="authPassword" required minlength="6" autocomplete="current-password"></label><div class="form-grid"><button class="button primary" type="submit" id="signInBtn" data-t="signIn">Sign in</button><button class="button secondary" type="button" id="signUpBtn" data-t="createAccount">Create account</button></div><p class="muted tiny" data-t="authNote">Configure your Supabase URL and anon key in config.js first.</p><button type="button" class="button secondary full" id="signOutBtn" hidden data-t="signOut">Sign out</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
